{% extends "base.html" %}{% block content %}<div class="page-head"><h1>{{ title }}</h1></div><section class="card form-card"><form method="post" {% if multipart %}enctype="multipart/form-data"{% endif %} class="form-stack">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<label>{{ field.label }}{% if field.field.required %}<span class="required">*</span>{% endif %}{{ field }}{% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}{{ field.errors }}</label>{% endfor %}<div class="actions"><a class="btn" href="{{ cancel_url }}">Отмена</a><button class="btn primary" type="submit">Сохранить</button></div></form></section>{% endblock %}
